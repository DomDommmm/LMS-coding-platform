[project]
name = "business-application"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "aio-pika>=10.0.1",
    "alembic>=1.18.5",
    "asyncpg>=0.31.0",
    "cryptography>=49.0.0",
    "fastapi[standard]>=0.139.0",
    "grpcio>=1.83.0",
    "grpcio-tools>=1.83.0",
    "minio>=7.2.20",
    "pwdlib[argon2]>=0.3.0",
    "pyjwt>=2.13.0",
    "python-dotenv>=1.2.2",
    "python-multipart>=0.0.32",
    "sqlalchemy[asyncio]>=2.0.51",
    "upstash-redis>=1.7.0",
]

[dependency-groups]
dev = [
    "httpx2>=2.9.1",
    "mypy-protobuf>=5.1.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"

[tool.pyright]
extraPaths = ["."]

